# Ollama läuft als HOST-Service (NICHT im Compose).
# App-Container erreicht ihn via http://host.docker.internal:11434
services:
  app:
    build: .
    container_name: kafin-app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATA_DIR: /data
      DATABASE_URL: /data/research.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
