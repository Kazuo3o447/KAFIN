        // ====================================================================
        // ON-DEMAND: Strukturierte CRM-Adresse aus Audit-Daten extrahieren
        // Wird NUR aufgerufen wenn der User auf "CRM einpflegen" klickt
        // ====================================================================
        const fetchCRMAddressData = async (auditResult, company, appConfig, onLog) => {
            if (!auditResult) return {};
            const bf = auditResult.baseFacts || {};
            const sections = auditResult.sections || {};

            // Kontext aus bereits vorhandenen Audit-Texten zusammenstellen
            const contextParts = [
                bf.headquarters && bf.headquarters !== 'UNBEKANNT' ? `Hauptsitz laut Basisfakten: ${bf.headquarters}` : null,
                bf.country && bf.country !== 'UNBEKANNT' ? `Land: ${bf.country}` : null,
                sections.company_background?.summary ? `Hintergrund: ${sections.company_background.summary.substring(0, 600)}` : null,
                sections.location_germany?.summary ? `Standort DE: ${sections.location_germany.summary.substring(0, 400)}` : null,
                sections.germany_presence?.summary ? `Präsenz DE: ${sections.germany_presence.summary.substring(0, 400)}` : null,
            ].filter(Boolean).join('\n\n');

            if (!contextParts) {
                onLog('INFO: CRM-Adressextraktion: keine Audit-Texte vorhanden, überspringe.');
                return {};
            }

            const prompt = `Extrahiere strukturierte Adressdaten für das Unternehmen "${company}" aus den folgenden Audit-Informationen. Antworte NUR mit JSON, kein Markdown.

PRIORITÄT: Bevorzuge eine deutsche Niederlassung/Tochtergesellschaft. Falls keine vorhanden, nimm den Hauptsitz.

{
  "street": "Straßenname ohne Hausnummer, oder UNBEKANNT",
  "houseNumber": "Hausnummer, oder UNBEKANNT",
  "postcode": "Postleitzahl, oder UNBEKANNT",
  "city": "Stadt, oder UNBEKANNT",
  "state": "Bundesland/Kanton, oder UNBEKANNT",
  "country": "Vollständiges Land, oder UNBEKANNT",
  "isGermanAddress": true oder false,
  "confidence": "HIGH / MEDIUM / LOW"
}

AUDIT-INFORMATIONEN:
${contextParts}`;

            try {
                onLog('INFO: Extrahiere CRM-Adressdaten on-demand...');
                const response = await fetch(appConfig.azureEndpoint.trim(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.1,
                        max_tokens: 400
                    })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const text = data.choices?.[0]?.message?.content || data.content || '';
                const addr = parseRobustJSON(text);
                const clean = (v) => (!v || v === 'UNBEKANNT') ? '' : v;
                onLog(`INFO: CRM-Adresse extrahiert – ${clean(addr.city) || '?'}, ${clean(addr.country) || '?'} (Konfidenz: ${addr.confidence || '?'})`);
                return {
                    street:      clean(addr.street),
                    houseNumber: clean(addr.houseNumber),
                    postcode:    clean(addr.postcode),
                    city:        clean(addr.city),
                    state:       clean(addr.state),
                    country:     clean(addr.country),
                    confidence:  addr.confidence || 'LOW',
                };
            } catch (err) {
                onLog(`WARN: CRM-Adressextraktion fehlgeschlagen: ${err.message}`);
                return {};
            }
        };

        // ====================================================================
        // HELPER: Audit-Daten für CRM extrahieren
        // ====================================================================
        const extractCRMDataFromAudit = (auditResult, companyName, legalForm, originCountry, industry) => {
            if (!auditResult) return { name: companyName };

            const sections  = auditResult.sections || {};
            const bf        = auditResult.baseFacts || {};
            const pf        = auditResult.precisionFields || {};

            const val = (v) => (!v || v === 'UNBEKANNT' || v === 'KEINE BEKANNT' || v === 'NICHT BÖRSENNOTIERT') ? '' : v;

            const resolvedName      = val(bf.officialName)  || companyName;
            const resolvedLegalForm = val(bf.legalForm)     || pf.legalForm || legalForm || '';
            const resolvedIndustry  = val(bf.industry)      || pf.industry  || industry  || '';
            const resolvedCountry   = val(bf.country)       || pf.originCountry || originCountry || '';

            const summary     = sections.zusammenfassung?.summary || '';
            const keyFindings = sections.zusammenfassung?.keyFindings || [];

            const descriptionLines = [
                `AUDIT BERICHT (${auditResult.auditMode === 'advanced' ? 'Full Audit' : 'Screening'})`,
                `Datum: ${new Date().toLocaleDateString('de-DE')}`,
                '',
                summary ? summary.substring(0, 600) + (summary.length > 600 ? '...' : '') : null,
                keyFindings.length ? '\nHaupt-Erkenntnisse:\n' + keyFindings.map((f, i) => `${i+1}. ${f}`).join('\n') : null,
            ].filter(l => l !== null).join('\n');

            return {
                name:        resolvedName,
                legalForm:   resolvedLegalForm,
                industry:    resolvedIndustry,
                originCountry: resolvedCountry,
                description: descriptionLines.substring(0, 2000),
                // Adressfelder zunächst leer – werden on-demand via fetchCRMAddressData befüllt
                street: '', houseNumber: '', street2: '',
                postcode: '', city: '', state: '',
                country: resolvedCountry,
                // Kundengruppe: Versuch aus Mitarbeiterzahl abzuleiten
                customerGroupCode: (() => {
                    const emp = parseInt(bf.employees) || parseInt(pf.employees) || 0;
                    if (emp <= 0) return '';
                    if (emp <= 10) return '139550000';
                    if (emp <= 50) return '139550001';
                    if (emp <= 250) return '139550002';
                    if (emp <= 500) return '139550003';
                    return '139550004';
                })(),
                auditDate:  new Date().toISOString(),
                auditMode:  auditResult.auditMode === 'advanced' ? 'Full Audit' : 'Screening',
                addressLoading: false,
                addressConfidence: null,
            };
        };

        // ====================================================================
        // CRM: neue Methoden für strukturiertes Update/Create
        // ====================================================================
        CRMService.updateCRMRecordFull = async function(accountId, auditData, formData, onLog) {
            try {
                onLog(`INFO: Aktualisiere CRM (strukturiert): ${accountId}`);
                const token = await this.getCRMToken(onLog);
                const updateData = {
                    name: formData.name || auditData.companyName,
                    description: (formData.description || '').substring(0, 2000),
                    address1_line1: [formData.street, formData.houseNumber].filter(Boolean).join(' ').substring(0, 250),
                    address1_line2: (formData.street2 || '').substring(0, 251),
                    address1_postalcode: (formData.postcode || '').substring(0, 20),
                    address1_city: (formData.city || '').substring(0, 80),
                    address1_stateorprovince: (formData.state || '').substring(0, 50),
                    crmgtai_auditdatum_date: formData.auditDate || new Date().toISOString(),
                };
                // Kundengruppe (Pickliste)
                if (formData.customerGroupCode) {
                    updateData.crmgtai_kundengruppecode = parseInt(formData.customerGroupCode);
                }
                // Audit-Modus (Custom-Feld, nicht im offiziellen Mapping)
                if (formData.auditMode) updateData.new_auditmode = formData.auditMode;

                // Branche Lookup auflösen
                if (formData.industry) {
                    const industryId = await this.resolveIndustryLookup(formData.industry, onLog);
                    if (industryId) {
                        updateData['crmgtai_brancheid@odata.bind'] = `/msevtmgt_industrys(${industryId})`;
                    }
                }
                // Land Lookup auflösen
                if (formData.country) {
                    const countryId = await this.resolveCountryLookup(formData.country, onLog);
                    if (countryId) {
                        updateData['crmgtai_land@odata.bind'] = `/crmgtai_land_globals(${countryId})`;
                    }
                }
                
                const response = await fetch(`${CRM_CONFIG.apiUrl}accounts(${accountId})`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json; charset=utf-8', 'OData-MaxVersion': '4.0', 'OData-Version': '4.0' },
                    body: JSON.stringify(updateData)
                });
                if (!response.ok) { const errorText = await response.text(); throw new Error(`Update ${response.status}: ${errorText.substring(0, 100)}`); }
                onLog("SUCCESS: CRM-Datensatz vollständig aktualisiert");
                return { success: true, accountId };
            } catch (error) {
                onLog(`ERROR: CRM-Update fehlgeschlagen: ${error.message}`);
                return { success: false, error: error.message };
            }
        };

        CRMService.createCRMRecordFull = async function(auditData, formData, onLog) {
            try {
                onLog("INFO: Erstelle neuen CRM-Datensatz (strukturiert)...");
                const token = await this.getCRMToken(onLog);
                const createData = {
                    name: formData.name || auditData.companyName,
                    description: (formData.description || '').substring(0, 2000),
                    address1_line1: [formData.street, formData.houseNumber].filter(Boolean).join(' ').substring(0, 250),
                    address1_line2: (formData.street2 || '').substring(0, 251),
                    address1_postalcode: (formData.postcode || '').substring(0, 20),
                    address1_city: (formData.city || '').substring(0, 80),
                    address1_stateorprovince: (formData.state || '').substring(0, 50),
                    crmgtai_auditdatum_date: formData.auditDate || new Date().toISOString(),
                };
                // Kundengruppe (Pickliste)
                if (formData.customerGroupCode) {
                    createData.crmgtai_kundengruppecode = parseInt(formData.customerGroupCode);
                }
                // Audit-Modus (Custom-Feld, nicht im offiziellen Mapping)
                if (formData.auditMode) createData.new_auditmode = formData.auditMode;

                // Branche Lookup auflösen
                if (formData.industry) {
                    const industryId = await this.resolveIndustryLookup(formData.industry, onLog);
                    if (industryId) {
                        createData['crmgtai_brancheid@odata.bind'] = `/msevtmgt_industrys(${industryId})`;
                    }
                }
                // Land Lookup auflösen (Pflichtfeld)
                if (formData.country) {
                    const countryId = await this.resolveCountryLookup(formData.country, onLog);
                    if (countryId) {
                        createData['crmgtai_land@odata.bind'] = `/crmgtai_land_globals(${countryId})`;
                    }
                }

                const response = await fetch(`${CRM_CONFIG.apiUrl}accounts`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json; charset=utf-8', 'OData-MaxVersion': '4.0', 'OData-Version': '4.0' },
                    body: JSON.stringify(createData)
                });
                if (!response.ok) { const errorText = await response.text(); throw new Error(`Erstellung ${response.status}: ${errorText.substring(0, 100)}`); }
                const location = response.headers.get('OData-EntityId');
                let accountId = null;
                if (location) { const match = location.match(/accounts\(([^)]+)\)/); if (match) accountId = match[1]; }
                onLog(`SUCCESS: CRM-Datensatz erstellt mit ID: ${accountId}`);
                return { success: true, accountId };
            } catch (error) {
                onLog(`ERROR: CRM-Erstellung fehlgeschlagen: ${error.message}`);
                return { success: false, error: error.message };
            }
        };

        // ====================================================================
        // NEUE KOMPONENTE: CRM Data Review Modal

                                        {isHighQuality
                                            ? 'Felder wurden automatisch aus dem Audit befüllt – bitte prüfen und ggf. korrigieren.'

                                            <label>Land <span className="crm-required">*</span></label>
                                            <input type="text" value={formData.country || ''} onChange={e => setField('country', e.target.value)} placeholder="z.B. Deutschland" />

                            {activeTab === 'audit' && (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className={inputCls}>
                                            <label>Audit-Modus</label>
                                            <input type="text" value={formData.auditMode || ''} onChange={e => setField('auditMode', e.target.value)} readOnly className="cursor-default" />
                                        </div>
                                        <div className={inputCls}>
                                            <label>Audit-Datum</label>
                                            <input type="date" value={formData.auditDate ? formData.auditDate.substring(0,10) : ''} onChange={e => setField('auditDate', e.target.value + 'T00:00:00.000Z')} />
                                        </div>

                                    <div className="bg-secondary-50 dark:bg-secondary-800 rounded-xl p-4 text-xs text-secondary-500 dark:text-secondary-400 border border-secondary-200 dark:border-secondary-700">

                                        Diese Felder werden in Dynamics 365 in den Feldern <strong>crmgtai_auditdatum_date</strong> und <strong>new_auditmode</strong> gespeichert.

                        {/* Footer */}
                        <div className="px-6 py-4 border-t border-secondary-200 dark:border-secondary-700 flex gap-3 bg-secondary-50/50 dark:bg-secondary-800/30 rounded-b-2xl">

                                Abbrechen
                            </button>
                            <button 
                                onClick={() => onConfirm(formData, selectedMatch)}
                                className={`flex-1 ${isUpdate ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'} text-white px-4 py-2.5 rounded-lg font-medium transition flex items-center justify-center gap-2 text-sm shadow-md`}
                            >
                                <i className={`fa-solid ${isUpdate ? 'fa-database' : 'fa-check'}`}></i>

        };

        // ====================================================================
        // NEUE KOMPONENTE: Horizontale Audit-Tabs
        // ====================================================================
        const AuditSectionTabs = ({ result, mode, darkMode }) => {
            const sections = result?.sections || {};
            const sortedKeys = Object.entries(window.SECTION_CONFIG)
                .sort(([,a],[,b]) => a.order - b.order)
                .map(([key]) => key)
                .filter(key => sections[key]);

            const [activeKey, setActiveKey] = useState(sortedKeys[0] || '');

            useEffect(() => {
                if (sortedKeys.length > 0 && (!activeKey || !sortedKeys.includes(activeKey))) {
                    setActiveKey(sortedKeys[0]);
                }
            }, [result]);

            if (sortedKeys.length === 0) return null;

            const isAdvanced = mode === 'advanced' || mode === 'full_audit';

            const getScoreColor = (score) => {
                const n = parseFloat(score);
                if (isNaN(n)) return '#94a3b8';
                if (n >= 7) return '#22c55e';
                if (n >= 4) return '#f59e0b';
                return '#ef4444';
            };

            return (
                <div className="glass-card overflow-hidden">
                    {/* Tab Bar */}
                    <div className="audit-tabs-bar px-2 pt-2">
                        {sortedKeys.map(key => {
                            const cfg = window.SECTION_CONFIG[key];
                            const sec = sections[key];
                            const score = isAdvanced && sec?.score !== undefined ? parseFloat(sec.score) : null;
                            const isSummary = key === 'zusammenfassung';
                            return (
                                <button
                                    key={key}
                                    onClick={() => setActiveKey(key)}
                                    className={`audit-tab ${activeKey === key ? 'active' : ''}`}
                                >
                                    <i className={`fa-solid ${cfg.icon} text-xs`}></i>
                                    <span>{sec.title || cfg.title || key}</span>
                                    {score !== null && !isNaN(score) && !isSummary && (
                                        <span className="audit-tab-score-dot" style={{background: getScoreColor(score)}} title={`Score: ${score.toFixed(1)}/10`}></span>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                    {/* Active Section Content */}
                    <div className="p-0">
                        {activeKey && sections[activeKey] && (
                            <DashboardCard 
                                key={activeKey} 
                                data={sections[activeKey]} 
                                mode={mode} 
                                sectionId={activeKey} 
                                darkMode={darkMode}
                                inlineMode={true}
                            />
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [company, setCompany] = useState("");
            const [searchLegalForm, setSearchLegalForm] = useState("");
            const [searchOriginCountry, setSearchOriginCountry] = useState("");
            const [searchIndustry, setSearchIndustry] = useState("");
            const [showPrecisionPanel, setShowPrecisionPanel] = useState(false);
            const [mode, setMode] = useState("simple");
            const [reportLanguage, setReportLanguage] = useState("de");
            const [isLoading, setIsLoading] = useState(false);
            const [logs, setLogs] = useState([]);
            const [result, setResult] = useState(null);
            const [isLogOpen, setIsLogOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isInfoOpen, setIsInfoOpen] = useState(false);
            const [isExportOpen, setIsExportOpen] = useState(false);
            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [settingsAuthenticated, setSettingsAuthenticated] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            const [appConfig, setAppConfig] = useState(window.DEFAULT_CONFIG);
            const [darkMode, setDarkMode] = useState(window.DEFAULT_CONFIG.darkMode || false);
            const [isCRMUpdateActive, setIsCRMUpdateActive] = useState(false);
            const [crmReviewModal, setCrmReviewModal] = useState({ isOpen: false, action: null, existingRecord: null, crmMatches: [] });
            const [showCRMDetail, setShowCRMDetail] = useState(true);
            const abortControllerRef = useRef(null);
            const [loadingProgress, setLoadingProgress] = useState(0);
            const [loadingStep, setLoadingStep] = useState('');

            useEffect(() => {
                const savedConfig = localStorage.getItem('comres_config');
                if (savedConfig) {
                    try {
                        const parsed = JSON.parse(savedConfig);
                        if (parsed.azureEndpoint && parsed.azureEndpoint.includes("openai.azure.com")) parsed.azureEndpoint = window.DEFAULT_CONFIG.azureEndpoint;
                        if (!parsed.azureEndpoint) parsed.azureEndpoint = window.DEFAULT_CONFIG.azureEndpoint;
                        if (!parsed.settingsPassword) parsed.settingsPassword = "gtai";
                        if (parsed.darkMode !== undefined) { 
                            setDarkMode(parsed.darkMode); 
                            if (parsed.darkMode) document.body.classList.add('dark'); 
                            else document.body.classList.remove('dark'); 
                        }
                        setAppConfig(prev => ({ ...prev, ...parsed }));
                        setReportLanguage(parsed.reportLanguage || 'de');
                        initFirebase(parsed.firebaseConfig);
                    } catch (e) {}
                }
            }, []);

            // DETAILIERTE LOG-FUNKTION
            const addLog = (text) => {
                const timestamp = new Date().toLocaleTimeString('de-DE', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    fractionalSecondDigits: 3 
                });
                
                // Bestimme Log-Level basierend auf Text
                let level = 'INFO';
                if (text.toUpperCase().includes('ERROR') || text.toUpperCase().includes('FEHLER')) {
                    level = 'ERROR';
                } else if (text.toUpperCase().includes('WARN') || text.toUpperCase().includes('WARNUNG')) {
                    level = 'WARN';
                } else if (text.toUpperCase().includes('SUCCESS')) {
                    level = 'SUCCESS';
                }
                
                const logEntry = { 
                    time: timestamp, 
                    text: text,
                    level: level
                };
                setLogs(prev => [...prev.slice(-99), logEntry]);
                
                // Automatisch Logs öffnen bei Fehlern
                if (level === 'ERROR') {
                    setIsLogOpen(true);
                }
                
                // Auch in der Konsole ausgeben für Debugging
                console.log(`[${timestamp}] [${level}] ${text}`);
            };
            
            const clearLogs = () => setLogs([]);
            
            const handleSaveSettings = (newConfig) => {
                if (newConfig.darkMode !== darkMode) { 
                    setDarkMode(newConfig.darkMode); 
                    if (newConfig.darkMode) document.body.classList.add('dark'); 
                    else document.body.classList.remove('dark'); 
                }
                setAppConfig(newConfig); 
                setReportLanguage(newConfig.reportLanguage || 'de'); 
                localStorage.setItem('comres_config', JSON.stringify(newConfig)); 
                initFirebase(newConfig.firebaseConfig); 
                setIsSettingsOpen(false); 
                setSettingsAuthenticated(false); 
                addLog("INFO: Einstellungen gespeichert");
            };
            
            const openSettingsWithAuth = () => { 
                if (!appConfig.settingsPassword || appConfig.settingsPassword.trim() === "" || settingsAuthenticated) {
                    setIsSettingsOpen(true); 
                } else {
                    setIsPasswordModalOpen(true); 
                }
            };
            
            const handlePasswordAuth = (newPassword = null) => { 
                if (newPassword !== null) { 
                    const updatedConfig = { ...appConfig, settingsPassword: newPassword }; 
                    setAppConfig(updatedConfig); 
                    localStorage.setItem('comres_config', JSON.stringify(updatedConfig)); 
                } 
                setSettingsAuthenticated(true); 
                setIsSettingsOpen(true); 
            };
            
            const handleEntraLogin = async () => { 
                try { 
                    addLog("INFO: Starte Microsoft Entra ID Login...");
                    await myMSALObj.loginPopup(loginRequest); 
                    setIsAuthenticated(true); 
                    addLog("SUCCESS: Erfolgreich bei Microsoft Entra ID angemeldet");
                } catch (e) { 
                    addLog(`ERROR: Login fehlgeschlagen: ${e.message}`);
                    showToast("Login fehlgeschlagen: " + e.message, "error"); 
                } 
            };
            
            const handleAudit = async (forceRefresh = false) => {
                if(!company.trim()) { 
                    setErrorMsg("Bitte geben Sie einen Firmennamen ein"); 
                    addLog("ERROR: Kein Firmenname eingegeben");
                    return; 
                }
                
                setIsLoading(true); 
                setResult(null); 
                setErrorMsg(""); 
                const controller = new AbortController();
                abortControllerRef.current = controller;
                setLoadingProgress(0);
                setLoadingStep('Initialisiere...');
                const precisionFields = { legalForm: searchLegalForm, originCountry: searchOriginCountry, industry: searchIndustry };
                const precisionLog = [searchLegalForm, searchOriginCountry, searchIndustry].filter(Boolean).join(', ');
                addLog(forceRefresh ? `INFO: Aktualisiere Audit für: ${company}` : `INFO: Starte Audit für: ${company}`);
                if (precisionLog) addLog(`INFO: Suchpräzisierung: ${precisionLog}`);
                addLog(`INFO: Modus: ${mode === 'simple' ? 'Screening' : 'Full Audit'}`);
                addLog(`INFO: Sprache: ${reportLanguage === 'de' ? 'Deutsch' : 'Englisch'}`);
                addLog(`INFO: App-Modus: ${appConfig.appMode === 'simulation' ? 'Simulation' : 'Produktion'}`);

                // NEU: Zuerst in Datenbank suchen (wenn Produktionsmodus und kein Refresh erzwungen)
                if (!forceRefresh && appConfig.appMode === 'production' && db) {
                    try {
                        const docId = company.toLowerCase().replace(/[^a-z0-9]/g, '');
                        addLog(`INFO: Prüfe Firebase Datenbank für ID: ${docId}...`);
                        const docRef = db.collection('comres_audits').doc(docId);
                        const doc = await docRef.get();
                        
                        if (doc.exists) {
                            const data = doc.data();
                            addLog(`INFO: Datensatz für ${company} in Firebase gefunden (erstellt: ${new Date(data.timestamp).toLocaleString('de-DE')}).`);
                            
                            // Flag setzen, dass Daten aus DB kommen
                            data.isFromDatabase = true;
                            
                            setResult(data);
                            setIsLoading(false);
                            return; // Abbruch, da Daten gefunden
                        } else {
                            addLog("INFO: Kein Eintrag in Firebase gefunden. Starte Live-Audit...");
                        }
                    } catch (dbCheckError) {
                        addLog(`WARN: Firebase-Datenbank-Check fehlgeschlagen: ${dbCheckError.message}`);
                        console.warn("DB Check Fehler:", dbCheckError);
                    }
                }

                try {
                    const auditResult = await runAudit(
                        company.trim(), appConfig, mode, reportLanguage, addLog, appConfig.appMode,
                        controller.signal,
                        (pct, stepText) => { setLoadingProgress(pct); if (stepText) setLoadingStep(stepText); },
                        precisionFields
                    );
                    
                    // Firebase speichern
                    if(db && appConfig.appMode === 'production') { 
                        try { 
                            addLog("INFO: Speichere Ergebnisse in Firebase Datenbank...");
                            await db.collection('comres_audits').doc(company.toLowerCase().replace(/[^a-z0-9]/g, '')).set(auditResult); 
                            addLog("SUCCESS: In Firebase Datenbank gespeichert"); 
                        } catch (dbError) {
                            addLog(`ERROR: Firebase-Datenbank-Speicherung fehlgeschlagen: ${dbError.message}`);
                            console.error("DB Save Error", dbError);
                        } 
                    }
                    
                    setResult(auditResult);
                    addLog("SUCCESS: Audit erfolgreich abgeschlossen");
                } catch(e) { 
                    addLog(`ERROR: Audit fehlgeschlagen: ${e.message}`);
                    setErrorMsg(e.message); 
                } finally { 
                    setIsLoading(false); 
                }
            };
            
            const cancelAudit = () => { 
                if(abortControllerRef.current) abortControllerRef.current.abort(); 
                setIsLoading(false); 
                addLog("WARN: Audit wurde manuell abgebrochen"); 
            };
            
            const toggleDarkMode = () => { 
                const newMode = !darkMode; 
                setDarkMode(newMode); 
                const newConfig = { ...appConfig, darkMode: newMode }; 
                setAppConfig(newConfig); 
                localStorage.setItem('comres_config', JSON.stringify(newConfig)); 
                if (newMode) document.body.classList.add('dark'); 
                else document.body.classList.remove('dark'); 
                addLog(`INFO: Dark Mode: ${newMode ? 'aktiviert' : 'deaktiviert'}`); 
            };
            
            const handleCRMOpen = (accountId) => {
                if (accountId) {
                    CRMService.openCRMRecord(accountId);
                    addLog(`INFO: Öffne CRM-Datensatz: ${accountId}`);
                }
            };
            
            const handleCRMUpdate = async (auditData, accountId) => {
                const existingRec = result?.crmData?.primaryRecord || null;
                const baseData = extractCRMDataFromAudit(result, company, searchLegalForm, searchOriginCountry, searchIndustry);
                // Öffne Modal sofort mit vorhandenen Daten
                setCrmReviewModal({ isOpen: true, action: 'update', existingRecord: existingRec, crmMatches: result?.crmData?.records || (existingRec ? [existingRec] : []), extractedData: { ...baseData, addressLoading: true } });
                // Adresse on-demand im Hintergrund nachladen
                const addr = await fetchCRMAddressData(result, company, appConfig, addLog);
                if (Object.keys(addr).length > 0) {
                    setCrmReviewModal(prev => ({ ...prev, extractedData: { ...prev.extractedData, ...addr, addressLoading: false, addressConfidence: addr.confidence } }));
                } else {
                    setCrmReviewModal(prev => ({ ...prev, extractedData: { ...prev.extractedData, addressLoading: false } }));
                }
            };

            const handleCRMSearch = async () => {
                if (!company.trim()) { showToast("Bitte zuerst Firmennamen eingeben", "warning"); return; }
                try {
                    addLog(`INFO: Starte manuelle CRM-Suche für: ${company}`);
                    const searchResult = await CRMService.searchCRMCompany(company, addLog);
                    const baseData = extractCRMDataFromAudit(result, company, searchLegalForm, searchOriginCountry, searchIndustry);
                    const action = (searchResult.success && searchResult.results.length > 0) ? 'update' : 'create';
                    const existingRec = action === 'update' ? searchResult.results[0] : null;
                    // Öffne Modal sofort
                    setCrmReviewModal({ isOpen: true, action, existingRecord: existingRec, crmMatches: searchResult.results || [], extractedData: { ...baseData, addressLoading: true } });
                    // Adresse im Hintergrund nachladen
                    const addr = await fetchCRMAddressData(result, company, appConfig, addLog);
                    if (Object.keys(addr).length > 0) {
                        setCrmReviewModal(prev => ({ ...prev, extractedData: { ...prev.extractedData, ...addr, addressLoading: false, addressConfidence: addr.confidence } }));
                    } else {
                        setCrmReviewModal(prev => ({ ...prev, extractedData: { ...prev.extractedData, addressLoading: false } }));
                    }
                } catch (error) {
                    addLog(`ERROR: CRM-Suche fehlgeschlagen: ${error.message}`);
                    showToast(`CRM-Suche fehlgeschlagen: ${error.message}`, "error");
                }
            };
            
            const handleCRMConfirm = async (crmFormData, selectedRecord) => {
                const { action } = crmReviewModal;
                setIsCRMUpdateActive(true);
                setCrmReviewModal({ isOpen: false, action: null, existingRecord: null, crmMatches: [], extractedData: null });
                
                try {
                    if (action === 'update' && selectedRecord && selectedRecord.id) {
                        addLog(`INFO: Starte CRM-Update für: ${selectedRecord.name}`);
                        const updateResult = await CRMService.updateCRMRecordFull(selectedRecord.id, result, crmFormData, addLog);
                        if (updateResult.success) {
                            addLog("SUCCESS: CRM erfolgreich aktualisiert");
                            showToast("CRM-Datensatz erfolgreich aktualisiert!", "success");
                            setResult(prev => ({ ...prev, crmSynced: true, crmLastUpdate: new Date().toISOString() }));
                        } else {
                            throw new Error(updateResult.error);
                        }
                    } else {
                        addLog(`INFO: Starte CRM-Erstellung für: ${company}`);
                        const createResult = await CRMService.createCRMRecordFull(result, crmFormData, addLog);
                        if (createResult.success) {
                            addLog("SUCCESS: CRM-Datensatz erfolgreich erstellt");
                            showToast("CRM-Datensatz erfolgreich erstellt!", "success");
                            setResult(prev => ({ ...prev, crmSynced: true, crmAccountId: createResult.accountId, crmLastUpdate: new Date().toISOString() }));
                        } else {
                            throw new Error(createResult.error);
                        }
                    }
                } catch (error) {
                    addLog(`ERROR: CRM-Operation fehlgeschlagen: ${error.message}`);
                    showToast(`CRM-Fehler: ${error.message}`, "error");
                } finally {
                    setIsCRMUpdateActive(false);
                }
            };
            
            const handleResetDashboard = () => {
                setResult(null);
                setCompany("");
                setSearchLegalForm("");
                setSearchOriginCountry("");
                setSearchIndustry("");
                setShowPrecisionPanel(false);
                setErrorMsg("");
                addLog("INFO: Dashboard zurückgesetzt");
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-secondary-100 dark:from-secondary-950 dark:to-secondary-900 relative">
                        <div className="glass-card p-10 shadow-2xl max-w-[440px] w-full relative z-10 animate-fade-in border-0" style={{boxShadow: "0 20px 60px rgba(0, 0, 0, 0.15)"}}>
                            <div className="mb-8 flex flex-col items-center">
                                <div className="text-primary-600 dark:text-white mb-4"><i className="fa-solid fa-shield-check text-5xl"></i></div>
                                <h1 className="text-2xl font-bold text-secondary-900 dark:text-white">GTAI Comres</h1>
                                <p className="text-secondary-500 dark:text-secondary-400 mt-2">Internal Audit Platform v4.1</p>
                            </div>
                            <button onClick={handleEntraLogin} className="w-full bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-700 hover:to-primary-600 text-white font-bold py-3 px-4 text-sm transition-all duration-300 flex items-center justify-center h-[42px] rounded-xl shadow-lg hover:shadow-xl">
                                <i className="fa-brands fa-microsoft mr-3 text-lg"></i> Mit Microsoft anmelden
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen bg-gradient-to-b from-secondary-50 to-white dark:from-secondary-950 dark:to-secondary-900 pb-32 relative ${darkMode ? 'dark' : ''}`}>
                    {isLoading && <DetailedAuditOverlay company={company} onCancel={cancelAudit} darkMode={darkMode} appMode={appConfig.appMode} isCRMUpdate={isCRMUpdateActive} externalProgress={loadingProgress} externalStep={loadingStep} />}
                    <header className="glass-effect border-b border-secondary-200 dark:border-secondary-800 sticky top-0 z-30 shadow-sm no-print">
                        <div className="h-1 gradient-bg"></div>
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <GTAILogo onReset={handleResetDashboard} />
                            <div className="flex items-center gap-4">
                                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold ${appConfig.appMode === 'simulation' ? 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400' : 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400'}`}>
                                    <i className={`fa-solid ${appConfig.appMode === 'simulation' ? 'fa-vial' : 'fa-rocket'}`}></i>
                                    <span>{appConfig.appMode === 'simulation' ? 'Simulation' : 'Produktion'}</span>
                                </div>
                                <div className="flex items-center gap-2 bg-white/50 dark:bg-secondary-900/50 rounded-lg p-1 border border-secondary-200 dark:border-secondary-800">
                                    {Object.values(window.LANGUAGES).map((lang) => (
                                        <button 
                                            key={lang.code} 
                                            onClick={() => { 
                                                setReportLanguage(lang.code); 
                                                const updatedConfig = {...appConfig, reportLanguage: lang.code}; 
                                                setAppConfig(updatedConfig); 
                                                localStorage.setItem('comres_config', JSON.stringify(updatedConfig)); 
                                            }} 
                                            className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${reportLanguage === lang.code ? 'gradient-bg text-white shadow-sm' : 'text-secondary-600 dark:text-secondary-400 hover:text-primary-500 dark:hover:text-primary-400'}`}
                                        >
                                            {lang.code.toUpperCase()}
                                        </button>
                                    ))}
                                </div>
                                {/* LOG BUTTON */}
                                <button onClick={() => setIsLogOpen(!isLogOpen)} className="p-2 text-secondary-500 dark:text-secondary-400 hover:text-primary-500 dark:hover:text-primary-400 transition rounded-lg hover:bg-secondary-100 dark:hover:bg-secondary-800 relative">
                                    <i className="fa-solid fa-terminal"></i>
                                    {logs.some(log => log.level === 'ERROR') && (
                                        <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                                    )}
                                </button>
                                <button onClick={toggleDarkMode} className="p-2 text-secondary-500 dark:text-secondary-400 hover:text-primary-500 dark:hover:text-primary-400 transition rounded-lg hover:bg-secondary-100 dark:hover:bg-secondary-800">
                                    <i className={`fa-solid ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                                <button onClick={() => setIsInfoOpen(true)} className="p-2 text-secondary-500 dark:text-secondary-400 hover:text-primary-500 dark:hover:text-primary-400 transition rounded-lg hover:bg-secondary-100 dark:hover:bg-secondary-800">
                                    <i className="fa-solid fa-circle-info"></i>
                                </button>
                                <button onClick={openSettingsWithAuth} className="p-2 text-secondary-500 dark:text-secondary-400 hover:text-primary-500 dark:hover:text-primary-400 transition rounded-lg hover:bg-secondary-100 dark:hover:bg-secondary-800">
                                    <i className="fa-solid fa-cog"></i>
                                </button>
                                <button onClick={() => setIsAuthenticated(false)} className="p-2 text-secondary-500 dark:text-secondary-400 hover:text-red-500 dark:hover:text-red-400 transition rounded-lg hover:bg-secondary-100 dark:hover:bg-secondary-800">
                                    <i className="fa-solid fa-power-off"></i>
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-6 py-10 main-container">
                        {errorMsg && (
                            <div className="mb-8 glass-card border-l-4 border-red-500 p-4 animate-fade-in">
                                <div className="flex items-center gap-3 text-red-600">
                                    <i className="fa-solid fa-exclamation-circle text-xl"></i>
                                    <div>
                                        <div className="font-bold">Fehler</div>
                                        <div>{errorMsg}</div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div className="glass-card p-8 mb-10 no-print gradient-border">
                            <label className="block text-xs font-black text-secondary-500 dark:text-secondary-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i className="fa-solid fa-magnifying-glass"></i> Unternehmensrecherche
                            </label>
                            <div className="flex gap-3 mb-4">
                                <input 
                                    type="text" 
                                    value={company} 
                                    onChange={e => setCompany(e.target.value)} 
                                    placeholder="Firmenname eingeben..." 
                                    className="input-modern flex-1 text-lg font-medium" 
                                    onKeyDown={e => e.key === 'Enter' && handleAudit()} 
                                />
                                <button 
                                    onClick={() => setShowPrecisionPanel(v => !v)} 
                                    className={`px-4 rounded-xl border-2 font-bold text-sm transition flex items-center gap-2 ${showPrecisionPanel ? 'border-primary-400 bg-primary-50/60 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400' : 'border-secondary-200 dark:border-secondary-700 text-secondary-500 dark:text-secondary-400 hover:border-secondary-300'}`}
                                    title="Suchpräzisierung"
                                >
                                    <i className="fa-solid fa-sliders"></i>
                                    <span className="hidden sm:inline">Präzisieren</span>
                                    {(searchLegalForm || searchOriginCountry || searchIndustry) && (
                                        <span className="w-2 h-2 rounded-full bg-primary-500"></span>
                                    )}
                                </button>
                                <button onClick={() => handleAudit(false)} className="gradient-bg text-white px-8 rounded-xl font-bold shadow-lg hover:opacity-90 transition flex items-center gap-3 animate-glow">
                                    <i className="fa-solid fa-play"></i> Start Audit
                                </button>
                            </div>

                            {/* Präzisierungsfelder */}
                            <div className={`precision-panel ${showPrecisionPanel ? 'open' : ''}`}>
                                <div className="border border-secondary-200 dark:border-secondary-700 rounded-xl p-4 mb-4 bg-secondary-50/60 dark:bg-secondary-900/40">
                                    <div className="text-xs font-bold text-secondary-500 dark:text-secondary-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-filter text-primary-500"></i> Suchpräzisierung
                                        <span className="font-normal normal-case tracking-normal text-secondary-400 dark:text-secondary-500">– verbessert die Suchqualität bei häufigen Firmennamen</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-secondary-500 dark:text-secondary-400 mb-1.5">Gesellschaftsform</label>
                                            <input
                                                type="text"
                                                value={searchLegalForm}
                                                onChange={e => setSearchLegalForm(e.target.value)}
                                                placeholder="z.B. GmbH, AG, LLC…"
                                                className="input-modern w-full text-sm py-2.5"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-secondary-500 dark:text-secondary-400 mb-1.5">Herkunftsland</label>
                                            <input
                                                type="text"
                                                value={searchOriginCountry}
                                                onChange={e => setSearchOriginCountry(e.target.value)}
                                                placeholder="z.B. USA, Japan, China…"
                                                className="input-modern w-full text-sm py-2.5"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-secondary-500 dark:text-secondary-400 mb-1.5">Branche</label>
                                            <input
                                                type="text"
                                                value={searchIndustry}
                                                onChange={e => setSearchIndustry(e.target.value)}
                                                placeholder="z.B. Automotive, Chemie…"
                                                className="input-modern w-full text-sm py-2.5"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                {Object.values(window.AUDIT_MODES).map(m => (
                                    <button 
                                        key={m.id} 
                                        onClick={() => setMode(m.id)} 
                                        className={`p-6 rounded-xl border-2 transition flex flex-col items-center justify-center gap-3 group h-32 ${mode === m.id ? 'border-primary-500 bg-primary-50/50 dark:bg-primary-900/10 shadow-md transform scale-[1.02]' : 'border-secondary-200 dark:border-secondary-800 hover:border-secondary-300 dark:hover:border-secondary-700 hover:bg-white/80 dark:hover:bg-secondary-800/80 hover:shadow-sm'}`}
                                    >
                                        <div className={`text-3xl ${mode === m.id ? 'text-primary-500' : 'text-secondary-400 dark:text-secondary-600'}`}>
                                            <i className={`fa-solid ${m.icon}`}></i>
                                        </div>
                                        <div className={`font-bold text-sm uppercase tracking-wide ${mode === m.id ? 'text-primary-500' : 'text-secondary-500'}`}>
                                            {m.name}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                        {result && (
                            <div className="animate-fade-in">
                                <div className="mb-10 pb-8 border-b border-secondary-200 dark:border-secondary-800 flex justify-between items-start">
                                    <div>
                                        {/* STATUS CHIPS - Updated Logic */}
                                        <div className="flex items-center gap-3 mb-4 flex-wrap">
                                            {/* DB vs Live Indicator */}
                                            {result.isFromDatabase ? (
                                                <div className="text-xs font-black uppercase tracking-widest px-3 py-1.5 rounded-lg flex items-center gap-2 bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400">
                                                    <i className="fa-solid fa-database"></i> Firebase-Eintrag
                                                </div>
                                            ) : (
                                                <div className="text-xs font-black text-secondary-500 dark:text-secondary-400 uppercase tracking-widest bg-secondary-100 dark:bg-secondary-800 px-3 py-1.5 rounded-lg">
                                                    Live Audit
                                                </div>
                                            )}

                                            <div className="text-xs font-bold bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 px-3 py-1.5 rounded-lg border border-primary-100 dark:border-primary-800">
                                                <i className="fa-solid fa-chart-bar mr-2"></i>
                                                {result.auditMode === 'simple' ? 'Screening' : 'Full Audit'}
                                            </div>
                                            
                                            {/* Update Button - Only if from DB */}
                                            {result.isFromDatabase && (
                                                <button 
                                                    onClick={() => handleAudit(true)} 
                                                    className="text-xs font-bold bg-white dark:bg-secondary-800 text-secondary-600 dark:text-secondary-300 border border-secondary-300 dark:border-secondary-600 px-3 py-1.5 rounded-lg hover:bg-secondary-50 dark:hover:bg-secondary-700 transition flex items-center gap-2 ml-2"
                                                    title="Daten neu abrufen und Firebase-Eintrag überschreiben"
                                                >
                                                    <i className="fa-solid fa-rotate-right"></i> Datensatz aktualisieren
                                                </button>
                                            )}
                                        </div>
                                        
                                        {/* Company Name */}
                                        <h1 className="text-4xl font-black text-secondary-900 dark:text-white tracking-tight mb-3">{result.companyName}</h1>
                                        
                                        {/* Date with Time */}
                                        <div className="flex flex-wrap gap-4 items-center">
                                            <div className="text-xs text-secondary-500 dark:text-secondary-400">
                                                <i className="fa-regular fa-clock mr-1"></i>
                                                Erstellt: {new Date(result.timestamp).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })} um {new Date(result.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {mode === 'advanced' && result.qualityScore && (
                                        <div className="text-right flex items-center gap-3">
                                            <button onClick={() => setIsExportOpen(true)} className="gradient-bg text-white px-5 py-2.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center gap-2 text-sm no-print">
                                                <i className="fa-solid fa-file-export"></i> Export
                                            </button>
                                        </div>
                                    )}
                                    {mode !== 'advanced' && (
                                        <div className="text-right flex items-center gap-3 no-print">
                                            <button onClick={() => setIsExportOpen(true)} className="gradient-bg text-white px-5 py-2.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center gap-2 text-sm">
                                                <i className="fa-solid fa-file-export"></i> Export
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* METRICS - NOW BELOW HEADER */}
                                <DashboardMetrics 
                                    result={result} 
                                    mode={mode} 
                                    darkMode={darkMode} 
                                    onCRMOpen={handleCRMOpen}
                                    onCRMSearch={handleCRMSearch}
                                    onCRMUpdate={handleCRMUpdate}
                                    onCRMDetailClose={() => setShowCRMDetail(false)}
                                />
                                
                                {mode === 'advanced' && result.scoreBreakdown && (
                                    <div className="mb-12 glass-card p-8 no-print">
                                        <div className="flex items-center gap-3 mb-6 border-b pb-4 border-secondary-200 dark:border-secondary-700">
                                            <div className="w-10 h-10 rounded-lg bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 flex items-center justify-center">
                                                <i className="fa-solid fa-chart-radar text-lg"></i>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-lg text-secondary-800 dark:text-secondary-200">Audit-Profil</h3>
                                                <p className="text-xs text-secondary-500 dark:text-secondary-400">Radar-Analyse aller bewerteten Dimensionen</p>
                                            </div>
                                        </div>
                                        <div className="radar-chart-container"><ScoreChart scoreBreakdown={result.scoreBreakdown} darkMode={darkMode} /></div>
                                    </div>
                                )}
                                <div className="dashboard-grid gap-6 items-start">
                                    {Object.entries(window.SECTION_CONFIG).sort(([,a], [,b]) => a.order - b.order).map(([key, config]) => {
                                        const section = result.sections?.[key];
                                        return section ? <DashboardCard key={key} data={section} mode={mode} sectionId={key} darkMode={darkMode} /> : null;
                                    })}
                                </div>
                                <div className="mt-12 pt-8 border-t border-secondary-200 dark:border-secondary-800 flex flex-col items-center no-print">
                                    <button onClick={() => setIsExportOpen(true)} className="gradient-bg text-white px-8 py-4 rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center gap-3 text-sm">
                                        <i className="fa-solid fa-file-export text-lg"></i> Bericht exportieren
                                    </button>
                                    <p className="text-xs text-secondary-400 dark:text-secondary-500 mt-3">PDF, Excel, PowerPoint, Word, CSV, JSON</p>
                                </div>
                            </div>
                        )}
                    </main>
                    <InfoModal isOpen={isInfoOpen} onClose={() => setIsInfoOpen(false)} darkMode={darkMode} />
                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={() => { setIsSettingsOpen(false); setSettingsAuthenticated(false); }} 
                        config={appConfig} 
                        onSave={handleSaveSettings} 
                        darkMode={darkMode}
                        onLog={addLog}
                    />
                    <PasswordModal 
                        isOpen={isPasswordModalOpen} 
                        onClose={() => setIsPasswordModalOpen(false)} 
                        onAuthenticate={handlePasswordAuth} 
                        currentPassword={appConfig.settingsPassword || ""} 
                        darkMode={darkMode} 
                    />
                    <LogConsole 
                        logs={logs} 
                        isOpen={isLogOpen} 
                        toggle={() => setIsLogOpen(!isLogOpen)} 
                        clearLogs={clearLogs} 
                        darkMode={darkMode} 
                    />
                    <ExportModal 
                        isOpen={isExportOpen} 
                        onClose={() => setIsExportOpen(false)} 
                        result={result} 
                        company={company} 
                        mode={mode} 
                        reportLanguage={reportLanguage} 
                        darkMode={darkMode} 
                    />
                    <CRMDataReviewModal
                        isOpen={crmReviewModal.isOpen}
                        onClose={() => setCrmReviewModal({ isOpen: false, action: null, existingRecord: null, crmMatches: [], extractedData: null })}
                        onConfirm={handleCRMConfirm}
                        action={crmReviewModal.action}
                        companyName={company}
                        existingRecord={crmReviewModal.existingRecord}
                        crmMatches={crmReviewModal.crmMatches || []}
                        extractedData={crmReviewModal.extractedData || {}}
                        darkMode={darkMode}
                    />
                    <footer className="absolute bottom-0 left-0 right-0 py-4 text-center text-xs text-secondary-500 dark:text-secondary-400 border-t border-secondary-200 dark:border-secondary-800 bg-white/50 dark:bg-secondary-900/50 backdrop-blur-sm no-print">
                        <div className="max-w-7xl mx-auto px-6">
                            GTAI Comres v4.1 • Azure AI Foundry • Dynamics 365 CRM • {appConfig.appMode === 'simulation' ? 'Simulationsmodus' : 'Produktionsmodus'}
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ToastContainer /><App /></ErrorBoundary>);
    </script>
</body>
</html>
